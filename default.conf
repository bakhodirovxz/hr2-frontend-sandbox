server {
    listen 80;

    # index.html — always revalidate so browsers get the latest bundle hash
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Clickjacking: sahifani faqat o'zimiz frame qila olamiz (PDF preview).
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }


    # HASHED assets — Vite puts a content hash in every filename under /assets/,
    # so these can be pinned forever.
    #
    # ⚠️ THIS USED TO BE AN EXTENSION REGEX, NOT A PATH PREFIX, and that is a
    # cache trap, not a style question: `/logo.svg`, `/favicon.svg` and above all
    # `/sw.js` (then) had NO hash in their names, yet they matched and were pinned for a
    # year. A returning browser could therefore never be told about a new logo or
    # a fixed service worker. Scoped to /assets/ the rule is true by construction.
    #
    # ⚠️ `expires 1y` ALREADY EMITS `Cache-Control: max-age=31536000`, so the old
    # `add_header Cache-Control "public, immutable"` next to it put TWO
    # Cache-Control headers on the wire, the second one without a max-age of its
    # own. One header, written out in full.
    location ^~ /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # UNHASHED static files at the root (logo, favicon, sw.js, 50x.html). They
    # are cacheable but they are NOT immutable — the filename never changes when
    # the content does, so the browser has to ask.
    location ~* ^/[^/]+\.(js|css|woff2?|ttf|eot|svg|png|ico|jpg|jpeg|gif|webp)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }


    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        # ⚠️ THE SPA FALLBACK NEEDED ITS OWN CACHE DIRECTIVE. `location =
        # /index.html` above only matches that literal URL; a deep link or a hard
        # refresh on `/employees` lands HERE and was served index.html with no
        # Cache-Control at all, i.e. heuristically cached — the common case was
        # the uncontrolled one, and a browser could hold a stale bundle hash.
        add_header Cache-Control "no-cache, must-revalidate" always;
        # VULN-002 (clickjacking): SPA marshrutlari shu yerdan index.html'ga
        # tushadi — add_header meros qilinmagani uchun bu yerda ham kerak.
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
