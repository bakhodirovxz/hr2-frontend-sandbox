services:
  hr-frontend-v2:
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 ATAYLAB: bu tasvirda `localhost` ::1 (IPv6) ga ketadi,
      # nginx esa faqat IPv4 0.0.0.0:80 ni tinglaydi — "connection refused".
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        # hr-backend-sandbox API manzili (brauzer nuqtai nazaridan).
        VITE_BASE_URL: "${VITE_BASE_URL:-http://localhost:8000}"
    ports:
      # v1 sandbox frontendi :3000 da — qabulgacha yonma-yon ishlaydi.
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - hr_network

networks:
  # Repo yakka o'zi ko'tarilishi kerak — tashqi tarmoq kutilmaydi.
  hr_network:
    driver: bridge
